[project]
name = "msa-pairformer"
version = "1.0.2"
description = "MSA Pairformer model repository"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}

authors = [
    {name = "Yo Akiyama", email = "yo_aki@mit.edu"}
]

maintainers = [
    {name = "Yo Akiyama", email = "yo_aki@mit.edu"}
]

dependencies = [
    "torch>=2.5.0",
    "numpy>=1.26,<2.0",
    "einops>=0.8.0",
    "einx>=0.3.0",
    "jaxtyping>=0.2.38",
    "tqdm>=4.67.1",
    "biopython>=1.85",
    "scipy>=1.8.0",
    "matplotlib>=3.5.1",
    "scikit-learn>=0.23.2",
    "environs>=14.5.0",
    "huggingface-hub>=0.24.0",
    "cuequivariance_ops_cu12>=0.7.0; sys_platform == 'linux'",
    "cuequivariance_ops_torch_cu12>=0.7.0; sys_platform == 'linux'",
    "cuequivariance_torch>=0.7.0; sys_platform == 'linux'",
    "cuequivariance>=0.7.0; sys_platform == 'linux'"
]

[tool.setuptools]
package-dir = {"" = "."}
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["msa_pairformer*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["msa_pairformer"]

[tool.hatch.build.targets.sdist]
only-include = ["msa_pairformer", "README.md", "LICENSE", "MIT_LICENSE", "pyproject.toml"]

[tool.ruff]
target-version = "py310"
line-length = 120
# Paper-reproduction code and notebooks are archival: reformatting them risks
# the published results, so they are linted separately (if ever), not here.
extend-exclude = ["Cell_2026_analysis_notebooks", "*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "RUF"]
ignore = [
    # Research code keeps unused loop/unpack bindings for readability.
    "RUF059",
    # `dict(...)` kwargs blocks are used deliberately for module config.
    "C408",
    # jaxtyping shape annotations (Float['b s n d']) are not forward references.
    # See msa_pairformer/custom_typing.py.
    "F722",
]

[tool.ty.src]
include = ["msa_pairformer"]

[tool.ty.environment]
python = ".venv"

[tool.ty.rules]
# Counterpart to ruff's F722: jaxtyping shape annotations such as
# Float['b s n d'] subscript a runtime object, which is not a type expression.
# See msa_pairformer/custom_typing.py.
invalid-type-form = "ignore"