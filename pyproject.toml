[project]
name = "msa-pairformer"
version = "1.0.2"
description = "MSA Pairformer model repository"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}

authors = [
    {name = "Yo Akiyama", email = "yo_aki@mit.edu"}
]

maintainers = [
    {name = "Yo Akiyama", email = "yo_aki@mit.edu"}
]

dependencies = [
    "torch>=2.5.0",
    "numpy>=1.26,<2.0",
    "einops>=0.8.0",
    "einx>=0.3.0",
    "jaxtyping>=0.2.38",
    "tqdm>=4.67.1",
    "biopython>=1.85",
    "scipy>=1.8.0",
    "matplotlib>=3.5.1",
    "scikit-learn>=0.23.2",
    "environs>=14.5.0",
    "huggingface-hub>=0.24.0",
    "cuequivariance_ops_cu12>=0.7.0; sys_platform == 'linux'",
    "cuequivariance_ops_torch_cu12>=0.7.0; sys_platform == 'linux'",
    "cuequivariance_torch>=0.7.0; sys_platform == 'linux'",
    "cuequivariance>=0.7.0; sys_platform == 'linux'"
]

[project.optional-dependencies]
# Runtime tensor shape/dtype validation, enabled with MSA_PAIRFORMER_TYPECHECK=1.
# Off by default because it adds per-call overhead on the model's hot path.
typecheck = ["beartype>=0.19.0"]
# Categorical Jacobian analysis (msa_pairformer/categorical_jacobian.py).
# Not needed for the model itself, only for coevolution analysis.
jacobian = ["jax>=0.4.20"]
# ProteinGym zero-shot variant effect evaluation (msa_pairformer/proteingym_utils.py).
proteingym = [
    "numba>=0.57",
    "pandas>=1.5",
]
# MSA pairing optimization (msa_pairformer/pairing_optimization/*), which uses
# the MSA Transformer from fair-esm as a baseline / dataset tokenizer.
pairing = ["fair-esm>=2.0.0"]
# Everything above except typecheck: all analysis and pairing extras at once.
analysis = [
    "msa-pairformer[jacobian]",
    "msa-pairformer[proteingym]",
    "msa-pairformer[pairing]",
]

# Not extras: nothing here ships. `bench/` and `tests/` are outside the wheel
# (see tool.hatch.build.targets.wheel), so publishing an extra for them would
# advertise something an installing user cannot run. Groups are the uv-native
# home for this and are installed by default on `uv sync`.
#
# ruff and ty stay out on purpose -- they run via `uvx`, which keeps tool
# versions from drifting into the runtime environment and keeps alpha `ty`
# out of a lock that pins the numerics.
[dependency-groups]
dev = [
    "pytest>=8.0",
    # Launches the throughput harness on rented GPUs (bench/modal_app.py).
    # bench/train.py itself imports nothing beyond the core dependencies, by
    # design, so the harness still runs on any GPU host without this.
    "modal>=1.0",
    # Referenced rather than duplicated, so the group cannot drift from the
    # published extra. tests/test_typecheck.py imports beartype at module
    # level, so without it the suite fails to collect rather than skipping --
    # `uv sync` alone would not install an extra.
    "msa-pairformer[typecheck]",
]

[tool.setuptools]
package-dir = {"" = "."}
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["msa_pairformer*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["msa_pairformer"]
# Deprecated top-level alias module keeping `import MSA_Pairformer` working for users of
# 1.0.2 and earlier. It has to be shipped explicitly: it is a module, not a package, and
# it cannot be a directory because MSA_Pairformer/ and msa_pairformer/ are the same path
# on case-insensitive filesystems.
force-include = {"MSA_Pairformer.py" = "MSA_Pairformer.py"}

[tool.hatch.build.targets.sdist]
only-include = [
    "msa_pairformer",
    "MSA_Pairformer.py",
    "README.md",
    "LICENSE",
    "MIT_LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # A test that `return`s instead of asserting is reported as a pass, so a
    # hand-rolled skip (`return SKIP_REASON`) reads as green while checking
    # nothing. Use @pytest.mark.skipif. Escalated narrowly rather than via a
    # blanket -W error, which torch/jaxtyping deprecations would drown out.
    "error::pytest.PytestReturnNotNoneWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 120
# Paper-reproduction code and notebooks are archival: reformatting them risks
# the published results, so they are linted separately (if ever), not here.
extend-exclude = ["Cell_2026_analysis_notebooks", "*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "RUF"]
ignore = [
    # Research code keeps unused loop/unpack bindings for readability.
    "RUF059",
    # `dict(...)` kwargs blocks are used deliberately for module config.
    "C408",
    # jaxtyping shape annotations (Float['b s n d']) are not forward references.
    # See msa_pairformer/custom_typing.py.
    "F722",
]

[tool.ty.src]
# `tests` is deliberately out of scope for now: it imports the model heavily and
# would reopen the diagnostics already triaged on msa_pairformer.
include = ["msa_pairformer", "bench"]

[tool.ty.environment]
python = ".venv"

[tool.ty.rules]
# Counterpart to ruff's F722: jaxtyping shape annotations such as
# Float['b s n d'] subscript a runtime object, which is not a type expression.
# See msa_pairformer/custom_typing.py.
invalid-type-form = "ignore"
